name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all sources
        run: python -m compileall -q ai3dgenerator blenderMcp tests checks
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run headless test suite
        run: pytest -q

  # The Blender MCP server on every OS, the oldest and newest supported Python,
  # and both major versions of the MCP SDK.
  blender-mcp:
    name: blender-mcp (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.mcp }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        mcp: ["mcp>=1.10,<2", "mcp>=2,<3"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install pytest "${{ matrix.mcp }}"
      - name: Run Blender MCP tests
        run: pytest -q tests/blenderBridge.py tests/blenderBridgeAssets.py

  # The add-on against real Blender through the bpy wheels (background mode).
  blender-addon:
    name: blender-addon (bpy ${{ matrix.bpy }}, ${{ matrix.mcp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bpy: "4.5.*"
            python: "3.11"
            mcp: "mcp>=1.10,<2"
          - bpy: "5.0.*"
            python: "3.11"
            mcp: "mcp>=2,<3"
          - bpy: "5.2.*"
            python: "3.13"
            mcp: "mcp>=2,<3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for bpy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1
      - name: Install
        run: pip install pytest "bpy==${{ matrix.bpy }}" "${{ matrix.mcp }}"
      - name: Run add-on tests on real Blender
        run: pytest -q tests/blenderBridgeAddon.py tests/blenderBridge.py tests/blenderBridgeAssets.py

  # The add-on in Blender's UI: Ubuntu's Blender 4.0 (legacy add-on path) under Xvfb.
  # No setup-python here: Ubuntu's Blender embeds the system libpython and takes its
  # prefix from the first python3.12 on PATH, so a toolcache Python would hide numpy.
  blender-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            blender python3-numpy python3-venv xvfb xauth libgl1-mesa-dri
      - name: Install the MCP SDK
        run: |
          python3 -m venv .venv
          .venv/bin/pip install "mcp>=2,<3"
      - name: Run the UI checks
        run: xvfb-run -a -s "-screen 0 1280x800x24" .venv/bin/python checks/blenderMcpUi.py --blender blender --artifacts ui-artifacts
      - name: Keep screenshots and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ui
          path: ui-artifacts
          if-no-files-found: ignore
