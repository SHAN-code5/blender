name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all sources
        run: python -m compileall -q ai_3d_generator tests
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run headless test suite
        run: pytest -q
